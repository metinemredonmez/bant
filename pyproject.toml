[project]
name = "btgen"
version = "0.1.0"
description = "Blue Therapy içerik üretici hattı"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28,<1",
    "pydantic>=2.11,<3",
    "python-dotenv>=1.1,<2",
    "pyyaml>=6.0,<7",
    "rich>=14,<15",
    "typer>=0.16,<1",
]

[project.scripts]
btgen = "btgen.cli:app"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: Açıkça istenen ve ücret oluşturabilen gerçek servis testi"]
